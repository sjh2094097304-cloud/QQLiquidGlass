name: Build Bubble 3.7

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      sign_release:
        description: '使用已配置的原发布签名生成可安装 APK'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Install required Android packages
        shell: bash
        run: |
          python3 - <<'PY'
          import os, subprocess
          sdkmanager = os.path.join(os.environ['ANDROID_HOME'], 'cmdline-tools/latest/bin/sdkmanager')
          subprocess.run([sdkmanager, 'platforms;android-35', 'build-tools;35.0.0'], check=True)
          PY
      - name: Prepare private release signing
        if: github.event_name == 'workflow_dispatch' && inputs.sign_release
        env:
          BB_KEYSTORE_BASE64: ${{ secrets.BB_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          encoded = os.environ.get('BB_KEYSTORE_BASE64', '')
          if not encoded:
              raise SystemExit('请先配置 BB_KEYSTORE_BASE64 等发布 Secrets')
          target = Path(os.environ['RUNNER_TEMP']) / 'bubble37-release.p12'
          target.write_bytes(base64.b64decode(encoded, validate=True))
          target.chmod(0o600)
          with open(os.environ['GITHUB_ENV'], 'a') as stream:
              stream.write('BB_KEYSTORE=' + str(target) + '\n')
          PY
      - name: Build signed release and verify certificate
        if: github.event_name == 'workflow_dispatch' && inputs.sign_release
        env:
          BB_STORE_PASSWORD: ${{ secrets.BB_STORE_PASSWORD }}
          BB_KEY_ALIAS: ${{ secrets.BB_KEY_ALIAS }}
          BB_KEY_PASSWORD: ${{ secrets.BB_KEY_PASSWORD }}
        run: python3 tools/build_release.py
      - name: Build unsigned validation package
        if: github.event_name != 'workflow_dispatch' || !inputs.sign_release
        run: python3 tools/build_release.py --unsigned
      - name: Upload build outputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bubble-3.7-${{ github.event_name == 'workflow_dispatch' && inputs.sign_release && 'signed' || 'unsigned' }}
          path: |
            build/deliverables/
            build/regression/results.txt
          if-no-files-found: error
          retention-days: 14
      - name: Remove temporary keystore
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          (Path(os.environ['RUNNER_TEMP']) / 'bubble37-release.p12').unlink(missing_ok=True)
          PY
