name: Build LiquidGlass APK

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - master
    tags:
      - "v*"

  pull_request:
    branches:
      - main
      - master

permissions:
  contents: write

concurrency:
  group: liquidglass-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build LiquidGlass / Android 35 / JDK 17

    runs-on: ubuntu-latest

    timeout-minutes: 30

    env:
      ANDROID_API: "35"
      BUILD_TOOLS_VERSION: "35.0.0"

    steps:

      # ============================================================
      # 1. Checkout
      # ============================================================

      - name: Checkout source
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false


      # ============================================================
      # 2. Java 17
      # ============================================================

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"


      # ============================================================
      # 3. Detect Android SDK
      #
      # 修复原来的：
      #
      # sdkmanager: command not found
      #
      # GitHub Ubuntu Runner 虽然预装 Android SDK，
      # 但 sdkmanager 不保证直接位于 PATH。
      #
      # 所以这里主动寻找真正的 sdkmanager。
      # ============================================================

      - name: Locate Android SDK
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Detecting Android SDK"
          echo "========================================"

          echo "Initial environment:"
          echo "ANDROID_HOME=${ANDROID_HOME:-<unset>}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-<unset>}"
          echo

          SDK_ROOT=""

          # --------------------------------------------------------
          # 优先使用 GitHub Runner 已提供的变量
          # --------------------------------------------------------

          if [[ -n "${ANDROID_SDK_ROOT:-}" && -d "${ANDROID_SDK_ROOT}" ]]; then
            SDK_ROOT="${ANDROID_SDK_ROOT}"

          elif [[ -n "${ANDROID_HOME:-}" && -d "${ANDROID_HOME}" ]]; then
            SDK_ROOT="${ANDROID_HOME}"

          # --------------------------------------------------------
          # GitHub Ubuntu Runner 常见 Android SDK 位置
          # --------------------------------------------------------

          elif [[ -d "/usr/local/lib/android/sdk" ]]; then
            SDK_ROOT="/usr/local/lib/android/sdk"

          elif [[ -d "${HOME}/Android/Sdk" ]]; then
            SDK_ROOT="${HOME}/Android/Sdk"

          elif [[ -d "/opt/android-sdk" ]]; then
            SDK_ROOT="/opt/android-sdk"

          fi


          # --------------------------------------------------------
          # 如果仍然找不到，再搜索常见目录
          # --------------------------------------------------------

          if [[ -z "$SDK_ROOT" ]]; then

            FOUND_SDKMANAGER="$(
              find \
                /usr/local/lib/android \
                /opt \
                "${HOME}" \
                -type f \
                -name sdkmanager \
                -path '*/cmdline-tools/*/bin/sdkmanager' \
                2>/dev/null \
                | head -n 1 \
                || true
            )"

            if [[ -n "$FOUND_SDKMANAGER" ]]; then

              SDK_ROOT="$(
                dirname \
                "$(dirname \
                "$(dirname \
                "$(dirname "$FOUND_SDKMANAGER")")")"
              )"

            fi

          fi


          # --------------------------------------------------------
          # 最终检查
          # --------------------------------------------------------

          if [[ -z "$SDK_ROOT" || ! -d "$SDK_ROOT" ]]; then
            echo "::error::Android SDK root could not be located."
            exit 1
          fi

          echo "Detected Android SDK:"
          echo "$SDK_ROOT"


          # --------------------------------------------------------
          # 保存给后续步骤
          # --------------------------------------------------------

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"


          # --------------------------------------------------------
          # 查找 sdkmanager
          # --------------------------------------------------------

          SDKMANAGER=""

          # 最新 command-line tools
          if [[ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]]; then

            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          else

            SDKMANAGER="$(
              find "$SDK_ROOT/cmdline-tools" \
                -type f \
                -path '*/bin/sdkmanager' \
                2>/dev/null \
                | sort -V \
                | tail -n 1 \
                || true
            )"

          fi


          # 老版本 SDK 兼容
          if [[ -z "$SDKMANAGER" && -x "$SDK_ROOT/tools/bin/sdkmanager" ]]; then

            SDKMANAGER="$SDK_ROOT/tools/bin/sdkmanager"

          fi


          if [[ -z "$SDKMANAGER" || ! -x "$SDKMANAGER" ]]; then

            echo "::error::Android SDK exists, but sdkmanager could not be found."

            echo
            echo "SDK tree:"
            find "$SDK_ROOT" \
              -maxdepth 5 \
              -type f \
              -name sdkmanager \
              -print \
              2>/dev/null \
              || true

            exit 1

          fi


          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

          SDKMANAGER_DIR="$(dirname "$SDKMANAGER")"

          echo "$SDKMANAGER_DIR" >> "$GITHUB_PATH"

          echo
          echo "sdkmanager:"
          echo "$SDKMANAGER"

          "$SDKMANAGER" --version || true


      # ============================================================
      # 4. Install Android Platform 35 + Build Tools 35.0.0
      # ============================================================

      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Android SDK installation"
          echo "========================================"

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "SDKMANAGER=$SDKMANAGER"
          echo


          # --------------------------------------------------------
          # 接受 Android SDK licenses
          #
          # yes 遇到 sdkmanager 提前结束可能产生 broken pipe，
          # 因此 license 阶段允许该情况，不影响后续真正安装。
          # --------------------------------------------------------

          set +o pipefail

          yes | "$SDKMANAGER" \
            --sdk_root="$ANDROID_SDK_ROOT" \
            --licenses \
            >/dev/null 2>&1 \
            || true

          set -o pipefail


          # --------------------------------------------------------
          # 安装编译需要的 Android SDK
          # --------------------------------------------------------

          "$SDKMANAGER" \
            --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${BUILD_TOOLS_VERSION}"


          echo
          echo "========================================"
          echo "Verify Android toolchain"
          echo "========================================"


          PLATFORM_JAR="$ANDROID_SDK_ROOT/platforms/android-${ANDROID_API}/android.jar"

          BUILD_TOOLS="$ANDROID_SDK_ROOT/build-tools/${BUILD_TOOLS_VERSION}"

          AAPT2="$BUILD_TOOLS/aapt2"

          ZIPALIGN="$BUILD_TOOLS/zipalign"

          D8_JAR="$BUILD_TOOLS/lib/d8.jar"

          APKSIGNER_JAR="$BUILD_TOOLS/lib/apksigner.jar"


          check_file() {

            local FILE="$1"

            if [[ ! -f "$FILE" ]]; then

              echo "::error::Required file missing: $FILE"

              exit 1

            fi

            echo "OK: $FILE"

          }


          check_exec() {

            local FILE="$1"

            if [[ ! -x "$FILE" ]]; then

              echo "::error::Required executable missing: $FILE"

              exit 1

            fi

            echo "OK: $FILE"

          }


          check_file "$PLATFORM_JAR"

          check_exec "$AAPT2"

          check_exec "$ZIPALIGN"

          check_file "$D8_JAR"

          check_file "$APKSIGNER_JAR"


          # --------------------------------------------------------
          # libxposed API
          # --------------------------------------------------------

          XPOSED_API="$GITHUB_WORKSPACE/vendor/libxposed-api-102/classes.jar"

          if [[ ! -f "$XPOSED_API" ]]; then

            echo "::error::libxposed API jar missing:"
            echo "$XPOSED_API"

            echo
            echo "vendor directory:"
            find "$GITHUB_WORKSPACE/vendor" \
              -maxdepth 4 \
              -type f \
              -print \
              2>/dev/null \
              || true

            exit 1

          fi

          echo "OK: $XPOSED_API"


          # --------------------------------------------------------
          # 保存固定路径给 build.sh
          # --------------------------------------------------------

          echo "ANDROID_PLATFORM_JAR=$PLATFORM_JAR" >> "$GITHUB_ENV"

          echo "ANDROID_BUILD_TOOLS=$BUILD_TOOLS" >> "$GITHUB_ENV"

          echo "LIBXPOSED_API_JAR=$XPOSED_API" >> "$GITHUB_ENV"


          echo
          echo "========================================"
          echo "Android toolchain ready"
          echo "========================================"

          echo "Platform:"
          echo "$PLATFORM_JAR"

          echo

          echo "Build tools:"
          echo "$BUILD_TOOLS"

          echo

          echo "libxposed:"
          echo "$XPOSED_API"


      # ============================================================
      # 5. Environment information
      # ============================================================

      - name: Show build environment
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Java"
          echo "========================================"

          java -version

          echo

          javac -version

          echo


          echo "========================================"
          echo "Python"
          echo "========================================"

          python3 --version

          echo


          echo "========================================"
          echo "Android SDK"
          echo "========================================"

          echo "ANDROID_HOME=$ANDROID_HOME"

          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          echo "ANDROID_PLATFORM_JAR=$ANDROID_PLATFORM_JAR"

          echo "ANDROID_BUILD_TOOLS=$ANDROID_BUILD_TOOLS"

          echo "LIBXPOSED_API_JAR=$LIBXPOSED_API_JAR"

          echo


          echo "========================================"
          echo "Build Tools"
          echo "========================================"

          "$ANDROID_BUILD_TOOLS/aapt2" version || true

          "$ANDROID_BUILD_TOOLS/zipalign" -h >/dev/null 2>&1 || true


      # ============================================================
      # 6. Make project scripts executable
      # ============================================================

      - name: Prepare build scripts
        shell: bash
        run: |
          set -euo pipefail

          chmod +x build.sh

          [[ -f setup-tools.sh ]] && chmod +x setup-tools.sh || true

          [[ -f tests/run.sh ]] && chmod +x tests/run.sh || true

          [[ -f tests/runtime.sh ]] && chmod +x tests/runtime.sh || true


      # ============================================================
      # 7. Regression tests
      # ============================================================

      - name: Run regression tests
        shell: bash
        run: |
          set -euo pipefail

          if [[ -f tests/run.sh ]]; then

            echo "========================================"
            echo "Running regression tests"
            echo "========================================"

            bash tests/run.sh

          else

            echo "::warning::tests/run.sh not found."
            echo "Skipping regression tests."

          fi


      # ============================================================
      # 8. Restore signing key
      #
      # GitHub Secrets 推荐：
      #
      # SIGNING_KEYSTORE_BASE64
      # KEYSTORE_PASSWORD
      # KEY_ALIAS
      # KEY_PASSWORD
      #
      # 如果未设置 Secret：
      #
      # 1. 仓库存在 debug.keystore -> 使用它
      # 2. 不存在 -> build.sh 自动创建临时 debug key
      #
      # Pull Request 不读取签名 Secret。
      # ============================================================

      - name: Restore signing key
        if: ${{ github.event_name != 'pull_request' }}
        shell: bash

        env:

          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}

          SECRET_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}

          SECRET_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}

          SECRET_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

        run: |
          set -euo pipefail


          if [[ -n "${SIGNING_KEYSTORE_BASE64:-}" ]]; then

            echo "========================================"
            echo "Restoring signing keystore"
            echo "========================================"

            KEYSTORE_FILE="$RUNNER_TEMP/liquidglass-signing.keystore"


            printf '%s' "$SIGNING_KEYSTORE_BASE64" \
              | base64 --decode \
              > "$KEYSTORE_FILE"


            chmod 600 "$KEYSTORE_FILE"


            if [[ ! -s "$KEYSTORE_FILE" ]]; then

              echo "::error::Decoded keystore is empty."

              exit 1

            fi


            if [[ -z "${SECRET_KEYSTORE_PASSWORD:-}" ]]; then

              echo "::error::KEYSTORE_PASSWORD secret is empty."

              exit 1

            fi


            echo "KEYSTORE=$KEYSTORE_FILE" >> "$GITHUB_ENV"

            echo "KEYSTORE_PASS=$SECRET_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"


            if [[ -n "${SECRET_KEY_PASSWORD:-}" ]]; then

              echo "KEY_PASS=$SECRET_KEY_PASSWORD" >> "$GITHUB_ENV"

            else

              echo "KEY_PASS=$SECRET_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"

            fi


            if [[ -n "${SECRET_KEY_ALIAS:-}" ]]; then

              echo "KEY_ALIAS=$SECRET_KEY_ALIAS" >> "$GITHUB_ENV"

            fi


            echo "Signing keystore restored successfully."


          elif [[ -f "$GITHUB_WORKSPACE/debug.keystore" ]]; then

            echo "========================================"
            echo "Using repository debug.keystore"
            echo "========================================"

            echo "No SIGNING_KEYSTORE_BASE64 secret configured."

            echo "build.sh will use:"
            echo "$GITHUB_WORKSPACE/debug.keystore"


          else

            echo "::warning::No fixed signing keystore configured."

            echo "build.sh will automatically create a debug keystore."

            echo
            echo "Important:"
            echo "APK signatures may be different between clean environments."
            echo "Such APKs may not be able to directly update an existing installation."

          fi


      # ============================================================
      # 9. Determine version before build
      # ============================================================

      - name: Read module version
        shell: bash
        run: |
          set -euo pipefail


          if [[ ! -f AndroidManifest.xml ]]; then

            echo "::error::AndroidManifest.xml not found."

            exit 1

          fi


          VERSION="$(
            sed -n \
              's/.*android:versionName="\([^"]*\)".*/\1/p' \
              AndroidManifest.xml \
              | head -n 1
          )"


          if [[ -z "$VERSION" ]]; then

            echo "::error::Could not read android:versionName from AndroidManifest.xml"

            exit 1

          fi


          APK_NAME="LiquidGlass-v${VERSION}.apk"


          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

          echo "APK_NAME=$APK_NAME" >> "$GITHUB_ENV"

          echo "APK_PATH=$GITHUB_WORKSPACE/$APK_NAME" >> "$GITHUB_ENV"


          echo "========================================"
          echo "LiquidGlass version"
          echo "========================================"

          echo "Version: $VERSION"

          echo "APK: $APK_NAME"


      # ============================================================
      # 10. Build APK
      # ============================================================

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail


          echo "========================================"
          echo "Building LiquidGlass"
          echo "========================================"

          echo "Version:"
          echo "$VERSION"

          echo

          echo "Android Platform:"
          echo "$ANDROID_PLATFORM_JAR"

          echo

          echo "Android Build Tools:"
          echo "$ANDROID_BUILD_TOOLS"

          echo

          echo "libxposed:"
          echo "$LIBXPOSED_API_JAR"

          echo


          # --------------------------------------------------------
          # 防止误把仓库中的旧 APK 当成本次构建产物
          # --------------------------------------------------------

          rm -f "$APK_PATH"


          # --------------------------------------------------------
          # 调用项目自身 build.sh
          #
          # build.sh 会读取：
          #
          # ANDROID_PLATFORM_JAR
          # ANDROID_BUILD_TOOLS
          # LIBXPOSED_API_JAR
          #
          # 以及可选：
          #
          # KEYSTORE
          # KEYSTORE_PASS
          # KEY_ALIAS
          # KEY_PASS
          # --------------------------------------------------------

          bash build.sh


          echo
          echo "========================================"
          echo "Checking APK"
          echo "========================================"


          if [[ ! -f "$APK_PATH" ]]; then

            echo "::error::Expected APK was not generated:"
            echo "$APK_PATH"

            echo
            echo "Workspace APK files:"

            find "$GITHUB_WORKSPACE" \
              -maxdepth 2 \
              -type f \
              -name "*.apk" \
              -print \
              || true

            exit 1

          fi


          if [[ ! -s "$APK_PATH" ]]; then

            echo "::error::Generated APK is empty."

            exit 1

          fi


          ls -lh "$APK_PATH"

          echo

          echo "SHA-256:"

          sha256sum "$APK_PATH"


      # ============================================================
      # 11. zipalign verification
      # ============================================================

      - name: Verify zipalign
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "zipalign verification"
          echo "========================================"

          "$ANDROID_BUILD_TOOLS/zipalign" \
            -c \
            -v \
            4 \
            "$APK_PATH"


      # ============================================================
      # 12. APK Signature verification
      # ============================================================

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "APK signature"
          echo "========================================"


          java \
            -cp "$ANDROID_BUILD_TOOLS/lib/apksigner.jar" \
            com.android.apksigner.ApkSignerTool \
            verify \
            --verbose \
            --print-certs \
            "$APK_PATH"


      # ============================================================
      # 13. Generate build information
      # ============================================================

      - name: Generate build information
        shell: bash
        run: |
          set -euo pipefail


          SHA256="$(
            sha256sum "$APK_PATH" \
              | awk '{print $1}'
          )"


          cat > BUILD-INFO.txt <<EOF
          LiquidGlass GitHub Actions Build

          Version:
          ${VERSION}

          APK:
          ${APK_NAME}

          SHA-256:
          ${SHA256}

          Git commit:
          ${GITHUB_SHA}

          Git ref:
          ${GITHUB_REF}

          GitHub run:
          ${GITHUB_RUN_NUMBER}

          Android API:
          ${ANDROID_API}

          Android Build Tools:
          ${BUILD_TOOLS_VERSION}

          Java:
          17

          Runner:
          ${RUNNER_OS} / ${RUNNER_ARCH}
          EOF


          cat BUILD-INFO.txt


      # ============================================================
      # 14. Upload APK
      # ============================================================

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:

          name: LiquidGlass-${{ env.VERSION }}-${{ github.run_number }}

          path: |
            ${{ env.APK_PATH }}
            BUILD-INFO.txt

          if-no-files-found: error

          retention-days: 30

          compression-level: 6


      # ============================================================
      # 15. GitHub Release
      #
      # git tag 示例：
      #
      # v0.4.2-qqdock.6
      #
      # push v* tag 后自动生成 Release。
      # ============================================================

      - name: Publish GitHub Release
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}

        shell: bash

        env:
          GH_TOKEN: ${{ github.token }}

        run: |
          set -euo pipefail


          TAG="$GITHUB_REF_NAME"


          echo "========================================"
          echo "GitHub Release"
          echo "========================================"

          echo "Tag: $TAG"

          echo "APK: $APK_PATH"


          if gh release view "$TAG" >/dev/null 2>&1; then

            echo "Release already exists."

            echo "Uploading/replacing APK..."


            gh release upload \
              "$TAG" \
              "$APK_PATH" \
              BUILD-INFO.txt \
              --clobber


          else

            echo "Creating new release..."


            gh release create \
              "$TAG" \
              "$APK_PATH" \
              BUILD-INFO.txt \
              --title "$TAG" \
              --generate-notes

          fi


      # ============================================================
      # 16. Final summary
      # ============================================================

      - name: Build summary
        if: ${{ success() }}
        shell: bash
        run: |
          set -euo pipefail


          SHA256="$(
            sha256sum "$APK_PATH" \
              | awk '{print $1}'
          )"


          {
            echo "# ✅ LiquidGlass APK 编译成功"
            echo
            echo "| 项目 | 内容 |"
            echo "|---|---|"
            echo "| Version | \`${VERSION}\` |"
            echo "| APK | \`${APK_NAME}\` |"
            echo "| Android API | \`${ANDROID_API}\` |"
            echo "| Build Tools | \`${BUILD_TOOLS_VERSION}\` |"
            echo "| JDK | \`17\` |"
            echo "| Commit | \`${GITHUB_SHA}\` |"
            echo "| SHA-256 | \`${SHA256}\` |"
            echo
            echo "APK 已上传到本次 GitHub Actions 的 **Artifacts**。"
          } >> "$GITHUB_STEP_SUMMARY"